name: Actualizar datos de SECOP

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar-datos.mjs
      - run: |
          git config user.name "actualizador-transparencia"
          git config user.email "actions@users.noreply.github.com"
          git add datos/resumen.json
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Datos de SECOP actualizados $(date -u +%Y-%m-%d)" && git push; fi
